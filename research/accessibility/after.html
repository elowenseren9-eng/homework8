<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="完成四项无障碍修正后的测试页">
  <title>无障碍审计修改后测试页</title>
  <style>
    body{margin:0;background:#fff;color:#263a33;font:16px/1.6 Arial,"Microsoft YaHei",sans-serif}.skip{position:absolute;top:-5rem;left:1rem;background:#fff;color:#111;padding:.8rem}.skip:focus{top:1rem}.wrap{max-width:760px;margin:4rem auto;padding:2rem}.card{padding:2rem;border:1px solid #cad7d2;border-radius:1rem;background:#f5faf8}.field{display:block;margin:1rem 0 .35rem;font-weight:700}input{display:block;width:100%;box-sizing:border-box;padding:.7rem;border:1px solid #657a72;border-radius:.4rem}.icon{margin-top:1rem;border:2px solid #0b6b4d;border-radius:.4rem;background:#fff;color:#07513b;font-size:1rem;padding:.6rem 1rem;font-weight:700}.icon:focus-visible,input:focus-visible{outline:3px solid #f1b94f;outline-offset:3px}.small{color:#52645d}
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <main id="main" class="wrap">
    <h1>自习室快速查询</h1>
    <section class="card" aria-labelledby="auditTitle">
      <h2 id="auditTitle">修正版本</h2>
      <img src="../../assets-logo.svg" width="64" height="64" alt="云大校园信息中心图标">
      <label class="field" for="keyword">空间名称</label>
      <input id="keyword" type="search" placeholder="例如：图书馆">
      <button class="icon" type="button" aria-pressed="false"><span aria-hidden="true">★</span> 收藏空间</button>
      <p class="small">说明文字已提高对比度，键盘焦点也有清晰的金色轮廓。</p>
    </section>
  </main>
</body>
</html>
